<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>__KEEL_TITLE__ · Keel Plan</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --surface:#151c25; --line:#303945; --text:#e6edf3; --muted:#a6b1bf; --accent:#80baff; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; scroll-padding-top:90px; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    a { color:var(--accent); text-underline-offset:4px; }
    a:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .topbar { border-bottom:1px solid var(--line); padding:16px 32px; display:flex; justify-content:space-between; background:var(--bg); gap:20px; }
    .brand { font:600 13px/1.8 ui-monospace,monospace; letter-spacing:.1em; }
    .status { color:#9be9a8; font-size:12px; }
    .layout { display:grid; grid-template-columns:220px minmax(0,1fr); max-width:1440px; margin:auto; gap:48px; padding:42px 32px 80px; }
    aside { position:sticky; top:24px; align-self:start; max-height:calc(100vh - 48px); overflow:auto; }
    .nav-label,.eyebrow { color:var(--muted); font-size:12px; letter-spacing:.08em; }
    nav { margin-top:18px; display:grid; gap:6px; }
    nav a { color:var(--muted); text-decoration:none; border-left:2px solid var(--line); padding:7px 12px; font-size:14px; }
    nav a:hover { color:var(--text); border-color:var(--accent); background:var(--surface); }
    main { min-width:0; }
    h1 { font-size:34px; line-height:1.3; margin:10px 0 18px; letter-spacing:-.025em; }
    .lead { color:var(--muted); margin:0 0 24px; }
    .stats { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:42px; }
    .stat { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:10px 18px; font-size:13px; color:var(--muted); }
    .stat strong { color:var(--text); font-size:20px; margin-right:8px; }
    h2 { font-size:23px; padding-top:24px; margin:32px 0 16px; border-top:1px solid var(--line); }
    h3 { font-size:18px; margin:26px 0 12px; }
    h4,h5,h6 { font-size:16px; }
    p,li { overflow-wrap:anywhere; }
    p { margin:12px 0; }
    ul,ol { padding-left:24px; }
    li { margin:8px 0; }
    code { font: .88em/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; background:#222d3b; border-radius:4px; padding:2px 5px; }
    pre { overflow:auto; padding:18px; background:#0b1016; border:1px solid var(--line); border-radius:6px; }
    pre code { background:none; padding:0; white-space:pre; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:8px; margin:18px 0; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th { background:var(--surface); text-align:left; color:var(--muted); font-weight:600; }
    th,td { padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; min-width:110px; overflow-wrap:anywhere; }
    tr:last-child td { border-bottom:0; }
    figure { margin:22px 0; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .diagram { background:#fff; padding:24px; overflow:auto; text-align:center; }
    .diagram img { max-width:100%; height:auto; vertical-align:middle; }
    figcaption { font-size:12px; color:var(--muted); padding:9px 16px; background:var(--surface); }
    details { padding:10px 16px; }
    summary { color:var(--accent); cursor:pointer; font-size:13px; }
    blockquote { border-left:3px solid var(--accent); padding:8px 16px; margin:18px 0; color:var(--muted); background:var(--surface); }
    .source { margin-top:44px; border:1px solid var(--line); border-radius:8px; }
    .source a { display:inline-block; margin-top:16px; }
    footer { color:var(--muted); font-size:12px; margin-top:28px; }
    @media(max-width:900px) { .layout { grid-template-columns:1fr; padding:24px 18px; gap:24px; } aside { position:static; max-height:none; } nav { grid-template-columns:repeat(2,minmax(0,1fr)); } h1 { font-size:28px; } }
    @media print { :root { color-scheme:light; --bg:white; --text:#111; --line:#ccc; --surface:#f7f7f7; --muted:#555; --accent:#23558b; } aside,.topbar,.source { display:none; } .layout { display:block; padding:0; } figure,table { break-inside:avoid; } code { background:#eee; } }
  </style>
</head>
<body>
  <header class="topbar"><span class="brand">KEEL / PLAN</span><span class="status">待用户审阅</span></header>
  <div class="layout">
    <aside><div class="nav-label">计划内容</div><nav aria-label="计划章节">__KEEL_NAV__</nav></aside>
    <main>
      <div class="eyebrow">业务设计与实施计划</div>
      <h1>__KEEL_TITLE__</h1>
      <p class="lead">从现有业务状态到本次改造。审阅后在会话中提出修改或确认计划。</p>
      <div class="stats">
        <div class="stat"><strong>__KEEL_FEATURE_COUNT__</strong>功能目标</div>
        <div class="stat"><strong>__KEEL_SELECTED_COUNT__</strong>功能选择了时序图</div>
        <div class="stat"><strong>__KEEL_DIAGRAM_COUNT__</strong>业务图表</div>
      </div>
      <article id="plan-content">__KEEL_CONTENT__</article>
      <details class="source"><summary>查看 Markdown 开发计划</summary>
        <a download="__KEEL_FILE_NAME__" href="data:text/markdown;charset=utf-8;base64,__KEEL_SOURCE_BASE64__">下载 Markdown</a>
        <pre><code>__KEEL_SOURCE__</code></pre>
      </details>
      <footer>由同一份 Markdown 生成 · Dev 与 Agent 以 Markdown 为开发依据</footer>
    </main>
  </div>
</body>
</html>
