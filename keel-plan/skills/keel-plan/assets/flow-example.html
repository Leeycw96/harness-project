<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>流程图样例 · 订单取消与退款 · Keel Plan</title>
  <style>
    :root { color-scheme:dark; --bg:#0d1117; --surface:#151c25; --line:#303945; --text:#e6edf3; --muted:#a6b1bf; --accent:#80baff; --code-bg:#0b1016; --inline-code:#222d3b; --status:#9be9a8; }
    :root[data-theme="light"] { color-scheme:light; --bg:#fff; --surface:#f6f8fa; --line:#d0d7de; --text:#1f2328; --muted:#59636e; --accent:#0969da; --code-bg:#f6f8fa; --inline-code:#eaeef2; --status:#1a7f37; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; scroll-padding-top:90px; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    a { color:var(--accent); text-underline-offset:4px; }
    a:focus-visible,summary:focus-visible,button:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .topbar { border-bottom:1px solid var(--line); padding:16px 32px; display:flex; align-items:center; flex-wrap:wrap; justify-content:space-between; background:var(--bg); gap:12px 20px; }
    .topbar-actions { display:flex; align-items:center; gap:16px; }
    .theme-toggle { font:inherit; font-size:13px; color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:6px 12px; min-height:36px; cursor:pointer; }
    .theme-toggle:hover { border-color:var(--accent); }
    .brand { font:600 13px/1.8 ui-monospace,monospace; letter-spacing:.1em; }
    .status { color:var(--status); font-size:12px; }
    .layout { display:grid; grid-template-columns:220px minmax(0,1fr); max-width:1440px; margin:auto; gap:48px; padding:42px 32px 80px; }
    aside { position:sticky; top:24px; align-self:start; max-height:calc(100vh - 48px); overflow:auto; }
    .nav-label,.eyebrow { color:var(--muted); font-size:12px; letter-spacing:.08em; }
    nav { margin-top:18px; display:grid; gap:6px; }
    nav a { color:var(--muted); text-decoration:none; border-left:2px solid var(--line); padding:7px 12px; font-size:14px; }
    nav a:hover { color:var(--text); border-color:var(--accent); background:var(--surface); }
    main { min-width:0; }
    h1 { font-size:34px; line-height:1.3; margin:10px 0 18px; letter-spacing:-.025em; }
    .lead { color:var(--muted); margin:0 0 24px; }
    h2 { font-size:23px; padding-top:24px; margin:32px 0 16px; border-top:1px solid var(--line); }
    h3 { font-size:18px; margin:26px 0 12px; }
    h4,h5,h6 { font-size:16px; }
    p,li { overflow-wrap:anywhere; }
    p { margin:12px 0; }
    ul,ol { padding-left:24px; }
    li { margin:8px 0; }
    code { font: .88em/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; background:var(--inline-code); border-radius:4px; padding:2px 5px; }
    pre { overflow:auto; padding:18px; background:var(--code-bg); border:1px solid var(--line); border-radius:6px; }
    pre code { background:none; padding:0; white-space:pre; }
    .sql-keyword { color:#ff7b72; } .sql-type { color:#79c0ff; }
    .sql-string { color:#a5d6ff; } .sql-number { color:#d2a8ff; } .sql-comment { color:#8b949e; }
    :root[data-theme="light"] .sql-keyword { color:#cf222e; }
    :root[data-theme="light"] .sql-type { color:#0550ae; }
    :root[data-theme="light"] .sql-string { color:#0a3069; }
    :root[data-theme="light"] .sql-number { color:#8250df; }
    :root[data-theme="light"] .sql-comment { color:#59636e; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:8px; margin:18px 0; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th { background:var(--surface); text-align:left; color:var(--muted); font-weight:600; }
    th,td { padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; min-width:110px; overflow-wrap:anywhere; }
    tr:last-child td { border-bottom:0; }
    figure { margin:22px 0; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .diagram { background:#fff; padding:24px; overflow:auto; text-align:center; }
    .diagram img { max-width:100%; height:auto; vertical-align:middle; }
    figcaption { font-size:12px; color:var(--muted); padding:9px 16px; background:var(--surface); }
    details { padding:10px 16px; }
    summary { color:var(--accent); cursor:pointer; font-size:13px; }
    blockquote { border-left:3px solid var(--accent); padding:8px 16px; margin:18px 0; color:var(--muted); background:var(--surface); }
    .source { margin-top:44px; border:1px solid var(--line); border-radius:8px; }
    .source a { display:inline-block; margin-top:16px; }
    footer { color:var(--muted); font-size:12px; margin-top:28px; }
    @media(max-width:900px) { .layout { grid-template-columns:1fr; padding:24px 18px; gap:24px; } aside { position:static; max-height:none; } nav { grid-template-columns:repeat(2,minmax(0,1fr)); } h1 { font-size:28px; } .diagram { text-align:left; } .diagram img { max-width:none; } }
    @media print { :root,:root[data-theme] { color-scheme:light; --bg:white; --text:#111; --line:#ccc; --surface:#f7f7f7; --muted:#555; --accent:#23558b; --code-bg:#f7f7f7; --inline-code:#eee; } aside,.topbar,.source { display:none; } .layout { display:block; padding:0; } figure,table { break-inside:avoid; } }
  </style>
  <script>
    (() => {
      const storageKey = 'keel-plan-theme';
      let theme = 'dark';
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch (_) {}
      document.documentElement.dataset.theme = theme;
      document.addEventListener('DOMContentLoaded', () => {
        const toggle = document.getElementById('theme-toggle');
        const update = () => {
          document.documentElement.dataset.theme = theme;
          toggle.textContent = theme === 'dark' ? '切换浅色' : '切换深色';
          toggle.setAttribute('aria-label', toggle.textContent + '模式');
        };
        toggle.addEventListener('click', () => {
          theme = theme === 'dark' ? 'light' : 'dark';
          update();
          try { localStorage.setItem(storageKey, theme); } catch (_) {}
        });
        update();
        toggle.hidden = false;
      });
    })();
  </script>
</head>
